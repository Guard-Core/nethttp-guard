name: Publish Containerized Demo

on:
  release:
    types: [created]
  push:
    branches:
      - master
    paths:
      - 'examples/**'
      - '.github/workflows/container-release.yml'
  workflow_dispatch:

permissions: {}

jobs:
  publish-container:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set version tag
        id: set_version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "VERSION=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"
            echo "IS_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "VERSION=latest" >> "$GITHUB_ENV"
            echo "IS_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: latest

      - name: Build with Docker Compose
        working-directory: ./examples/advanced_app
        run: |
          docker compose build

      - name: Tag and push to GHCR
        run: |
          IMAGE="ghcr.io/guard-core/nethttp-guard-example"
          docker tag nethttp-guard-advanced-app:local "${IMAGE}:latest"
          docker push "${IMAGE}:latest"

          if [[ "${{ env.IS_RELEASE }}" == "true" ]]; then
            docker tag nethttp-guard-advanced-app:local "${IMAGE}:${{ env.VERSION }}"
            docker push "${IMAGE}:${{ env.VERSION }}"
          fi
