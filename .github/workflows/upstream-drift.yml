name: Upstream Drift

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  upstream-drift:
    name: Test against guard-core-go@master
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout nethttp-guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout guard-core-go@master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rennf93/guard-core-go
          ref: master
          path: guard-core-go-upstream

      # No host Go toolchain: run the adapter suite inside golang:1.26-alpine,
      # pointing the guard-core-go dependency at upstream master.
      - name: Run the adapter test suite against guard-core-go@master
        run: |
          docker run --rm --network host \
            -v "$PWD":/work -w /work \
            -e GOCACHE=/tmp/gocache \
            -e REDIS_HOST=127.0.0.1 \
            golang:1.26-alpine sh -c '
              set -e
              go mod edit -replace github.com/rennf93/guard-core-go/v4=/work/guard-core-go-upstream
              go mod tidy
              go test ./...
              go test -tags integration ./...
            '
